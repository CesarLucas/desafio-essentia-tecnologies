<div class="login-container">
  <section class="hero-section">
    <div class="brand-wrapper">
      <div class="logo-placeholder">TechX</div>
    </div>
    <div class="hero-content">
      <h1>Comece sua jornada</h1>
      <p>Organize suas metas com precisão e clareza.</p>
    </div>
    <div class="hero-footer">
      <div class="status-badge">
      </div>
    </div>
  </section>

  <main class="form-section">
    <div class="form-wrapper">
      <header class="form-header">
        <h2>Criar Conta</h2>
        <p>Junte-se à TechX para gerenciar suas tarefas diárias.</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="input-group">
          <label for="nome">Nome Completo</label>
          <input 
            id="nome" 
            type="text" 
            formControlName="nome" 
            placeholder="Como quer ser chamado?"
            [class.error]="form.get('nome')?.invalid && form.get('nome')?.touched"
          >
          <small *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
            O nome é obrigatório.
          </small>
        </div>

        <div class="input-group">
          <label for="email">E-mail Corporativo</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="exemplo@techx.com"
            [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
          >
          <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Insira um e-mail válido.
          </small>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input 
            id="senha" 
            type="password" 
            formControlName="senha" 
            placeholder="Mínimo 6 caracteres"
            [class.error]="form.get('senha')?.invalid && form.get('senha')?.touched"
          >
          <small *ngIf="form.get('senha')?.invalid && form.get('senha')?.touched">
            A senha deve ter no mínimo 6 caracteres.
          </small>
        </div>

        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>

        <div class="success-message" *ngIf="success">
          {{ success }}
        </div>

        <button type="submit" [disabled]="form.invalid || loading" class="btn-primary">
          <span *ngIf="!loading">Cadastrar</span>
          <span *ngIf="loading" class="loader"></span>
        </button>
      </form>

      <footer class="form-footer">
        <p>Já tem uma conta? <a routerLink="/login">Fazer Login</a></p>
      </footer>
    </div>
  </main>
</div>
