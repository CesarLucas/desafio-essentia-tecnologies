<div class="login-container">
  <section class="hero-section">
    <div class="brand-wrapper">
      <div class="logo-placeholder">TechX</div>
    </div>
    <div class="hero-content">
      <h1>Grandes conquistas</h1>
      <p>começam com pequenas tarefas.</p>
    </div>
    <div class="hero-footer">
      <div class="status-badge">
      </div>
    </div>
  </section>

  <main class="form-section">
    <div class="form-wrapper">
      <header class="form-header">
        <h2>Acesso à Plataforma</h2>
        <p>Insira suas credenciais para gerenciar suas tarefas.</p>
      </header>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        <div class="input-group">
          <label for="email">E-mail Corporativo</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="exemplo@techx.com"
            [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
          >
          <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Insira um e-mail válido.
          </small>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input 
            id="senha" 
            type="password" 
            formControlName="senha" 
            placeholder="••••••••"
            [class.error]="form.get('senha')?.invalid && form.get('senha')?.touched"
          >
          <small *ngIf="form.get('senha')?.invalid && form.get('senha')?.touched">
            A senha deve ter no mínimo 6 caracteres.
          </small>
        </div>

        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>

        <button type="submit" [disabled]="form.invalid || loading" class="btn-primary">
          <span *ngIf="!loading">Entrar no Sistema</span>
          <span *ngIf="loading">Entrando...</span>
        </button>
      </form>

      <footer class="form-footer">
        <p>Esqueceu a senha? <a routerLink="/atualizar-senha">Atualizar senha</a></p>
      </footer>
    </div>
  </main>
</div>
